plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.0.0-beta4'
}

group = 'com.ultimateclassmanager'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'org.mindrot:jbcrypt:0.4'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['src']
        }
    }
}

application {
    mainClass = 'Main'
}

jar {
    manifest {
        attributes(
            'Main-Class': 'Main'
        )
    }
}

shadowJar {
    archiveBaseName.set('UltimateClassManager')
    archiveClassifier.set('all')
    archiveVersion.set(version)
    
    manifest {
        attributes(
            'Main-Class': 'Main'
        )
    }
}

tasks.named('build') {
    dependsOn shadowJar
}
